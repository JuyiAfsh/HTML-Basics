<!DOCTYPE html>
<html>

<head>
    <style>
        #flowerRight{
            float:right
        }
        #flowerLeft{
            float:left
        }
    </style>
    </head>
    <body>
        <h2>Float Right</h2>
        <p>In this exaple, the image will float to the right in the paragraph, and the text in the paragraph will wrap around the image.</p>
        <p>
            <img id="flowerRight" src="flower.png" alt="flower" style="width:80px; height:80px;"> 
            <img id="flowerLeft" src="flower.png" alt="flower" style="width:100px; height:100px;">
            This is a dummy content used to understand the float property
        </p>
    </body>
    </html>
