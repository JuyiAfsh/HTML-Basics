<!DOCTYPE html>
<html>
    <head>
        <style>
            div {
                right: 30px;
                border: 3px solid red;
            }
            div.fixed {
                position: fixed;
                top: 0px;
                right: 20px;
                width: 300px;
                border: 3px solid green;
            }
            div.sticky {
                position: sticky;
                top: 10px;
                left: 20px;
                width: 100px;
                border: 3px solid purple;
            }
            div.absolute {
                position: absolute;
                left: 50px;
                border: 3px solid blue;
            }
            div.relative {
                position: relative;
                left: 50px;
                border: 3px solid cyan;
            }
        </style>
    </head>
    <body>
        <h2>POSITIONING</h2>
        <div>Div with no position property</div>
        <div class="sticky">Div with sticky position property</div>
        <div class="relative">This div element has position: relative
            <div class="absolute"> Absolute class DIV</div>
        </div>
        <div class="fixed">Div with fixed position property</div>
